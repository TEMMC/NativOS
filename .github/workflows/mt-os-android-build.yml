name: MT-OS and MT-OS Desktop Android builds (small APK + separate Debian rootfs)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mt-os-android-build.yml"
      - "scripts/prepare-mt-os-rootfs.sh"
      - "scripts/build-rootfs-asset.sh"
      - "android/**"
      - "linux/bridge-client/**"
      - "linux/config/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt-os-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Debian ARM64 rootfs and build both MT-OS editions
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MTOS_SIGNING_ENABLED: ${{ secrets.MTOS_KEYSTORE_BASE64 != '' && secrets.MTOS_KEYSTORE_PASSWORD != '' && secrets.MTOS_KEY_ALIAS != '' && secrets.MTOS_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository without modifying Android app source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download official Debian Trixie ARM64 base rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/arm64 debian:trixie
          cid="$(docker create --platform linux/arm64 debian:trixie)"
          mkdir -p "$RUNNER_TEMP/mt-os-rootfs"
          docker export "$cid" | sudo tar -xpf - -C "$RUNNER_TEMP/mt-os-rootfs"
          docker rm "$cid"
          test -x "$RUNNER_TEMP/mt-os-rootfs/bin/bash"
          test -f "$RUNNER_TEMP/mt-os-rootfs/etc/debian_version"
          grep -q '^13' "$RUNNER_TEMP/mt-os-rootfs/etc/debian_version"
          echo "Debian base: $(cat "$RUNNER_TEMP/mt-os-rootfs/etc/debian_version")"
          echo "Rootfs disk usage:"
          sudo du -sh "$RUNNER_TEMP/mt-os-rootfs"

      - name: Enable ARM64 emulation for Debian rootfs preparation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install MT-Phoc, MT-Phosh and MT-OS runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare-mt-os-rootfs.sh scripts/build-rootfs-asset.sh
          scripts/prepare-mt-os-rootfs.sh \
            "$RUNNER_TEMP/mt-os-rootfs" \
            "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz"
          sha256sum --check "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz.sha256"
          ls -lh "$RUNNER_TEMP"/mt-os-rootfs-arm64.tgz*
          tar -tzf "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz" | grep -E '(^|/)usr/bin/(phoc|phosh|kgx)$|usr/share/mt-os/rootfs-packages.txt'
          ROOTFS_SHA256="$(awk '{print $1}' "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz.sha256")"
          ROOTFS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/mt-os-rootfs-${GITHUB_SHA}/mt-os-rootfs-arm64.tgz"
          echo "MTOS_ROOTFS_SHA256=$ROOTFS_SHA256" >> "$GITHUB_ENV"
          echo "MTOS_ROOTFS_URL=$ROOTFS_URL" >> "$GITHUB_ENV"
          echo "Published rootfs URL will be: $ROOTFS_URL"

      - name: Verify required existing app build inputs
        shell: bash
        run: |
          set -euxo pipefail
          echo "Commit: $GITHUB_SHA"
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/xlorie-upstream/arm64-v8a/libXlorie.so
          test -s "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz"
          test -s "$RUNNER_TEMP/mt-os-rootfs-arm64.tgz.sha256"
          test -n "$MTOS_ROOTFS_URL"
          test -n "$MTOS_ROOTFS_SHA256"
          echo "Rootfs SHA-256: $MTOS_ROOTFS_SHA256"
          echo "Rootfs URL: $MTOS_ROOTFS_URL"
          ls -lh "$RUNNER_TEMP"/mt-os-rootfs-arm64.tgz*

      - name: Build debug APK using the repository's existing source
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStandardDebug :app:assembleDesktopDebug

      - name: Prepare private Android release signing key
        if: env.MTOS_SIGNING_ENABLED == 'true'
        working-directory: android
        env:
          MTOS_KEYSTORE_BASE64: ${{ secrets.MTOS_KEYSTORE_BASE64 }}
          MTOS_KEYSTORE_PASSWORD: ${{ secrets.MTOS_KEYSTORE_PASSWORD }}
          MTOS_KEY_ALIAS: ${{ secrets.MTOS_KEY_ALIAS }}
          MTOS_KEY_PASSWORD: ${{ secrets.MTOS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$MTOS_KEYSTORE_BASE64" | base64 --decode > signing/mt-os-release.jks
          chmod 600 signing/mt-os-release.jks
          cat > signing/keystore.properties <<EOF
          storeFile=signing/mt-os-release.jks
          storePassword=$MTOS_KEYSTORE_PASSWORD
          keyAlias=$MTOS_KEY_ALIAS
          keyPassword=$MTOS_KEY_PASSWORD
          EOF
          chmod 600 signing/keystore.properties

      - name: Build signed release APK for future in-place updates
        if: env.MTOS_SIGNING_ENABLED == 'true'
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleStandardRelease :app:assembleDesktopRelease
          for APK in app/build/outputs/apk/standard/release/*.apk app/build/outputs/apk/desktop/release/*.apk; do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            sha256sum "$APK"
          done

      - name: Publish versioned Debian rootfs for first-launch download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mt-os-rootfs-${{ github.sha }}
          name: MT-OS Debian rootfs ${{ github.sha }}
          body: |
            Versioned Debian ARM64 root filesystem for MT-OS commit ${{ github.sha }}.
            This archive is downloaded by the matching small Android APK on first setup.
          files: |
            ${{ runner.temp }}/mt-os-rootfs-arm64.tgz
            ${{ runner.temp }}/mt-os-rootfs-arm64.tgz.sha256
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true

      - name: Upload debug APK and exact rootfs used by the build
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: mt-os-and-desktop-debug-and-rootfs-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/standard/debug/*.apk
            android/app/build/outputs/apk/desktop/debug/*.apk
            ${{ runner.temp }}/mt-os-rootfs-arm64.tgz
            ${{ runner.temp }}/mt-os-rootfs-arm64.tgz.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed release APK
        if: success() && env.MTOS_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: mt-os-and-desktop-signed-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/standard/release/*.apk
            android/app/build/outputs/apk/desktop/release/*.apk
          if-no-files-found: error
          retention-days: 90

# Rebuild requested after configuring the permanent MT-OS release-signing secrets.
