name: NativOS Android build (source unchanged)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nativos-android-build.yml"
      - "scripts/prepare-nativos-rootfs.sh"
      - "scripts/build-rootfs-asset.sh"
      - "linux/bridge-client/**"
      - "linux/config/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativos-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Debian ARM64 rootfs and build NativOS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NATIVOS_SIGNING_ENABLED: ${{ secrets.NATIVOS_KEYSTORE_BASE64 != '' && secrets.NATIVOS_KEYSTORE_PASSWORD != '' && secrets.NATIVOS_KEY_ALIAS != '' && secrets.NATIVOS_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository without modifying Android app source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download official Debian Trixie ARM64 base rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/arm64 debian:trixie
          cid="$(docker create --platform linux/arm64 debian:trixie)"
          mkdir -p "$RUNNER_TEMP/nativos-rootfs"
          docker export "$cid" | sudo tar -xpf - -C "$RUNNER_TEMP/nativos-rootfs"
          docker rm "$cid"
          test -x "$RUNNER_TEMP/nativos-rootfs/bin/bash"
          test -f "$RUNNER_TEMP/nativos-rootfs/etc/debian_version"
          grep -q '^13' "$RUNNER_TEMP/nativos-rootfs/etc/debian_version"
          echo "Debian base: $(cat "$RUNNER_TEMP/nativos-rootfs/etc/debian_version")"
          echo "Rootfs disk usage:"
          sudo du -sh "$RUNNER_TEMP/nativos-rootfs"

      - name: Enable ARM64 emulation for Debian rootfs preparation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install MT-Phoc, MT-Phosh and NativOS runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/prepare-nativos-rootfs.sh scripts/build-rootfs-asset.sh
          scripts/prepare-nativos-rootfs.sh \
            "$RUNNER_TEMP/nativos-rootfs" \
            "$GITHUB_WORKSPACE/android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz"
          cd android/app/src/main/assets/rootfs
          sha256sum --check nativos-rootfs-arm64.tgz.sha256
          ls -lh nativos-rootfs-arm64.tgz*
          tar -tzf nativos-rootfs-arm64.tgz | grep -E '(^|/)usr/bin/(phoc|phosh|kgx)$|usr/share/nativos/rootfs-packages.txt'

      - name: Verify required existing app build inputs
        shell: bash
        run: |
          set -euxo pipefail
          echo "Commit: $GITHUB_SHA"
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/xlorie-upstream/arm64-v8a/libXlorie.so
          test -s android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz
          test -s android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz.sha256
          ls -lah android/app/src/main/assets/rootfs/

      - name: Build debug APK using the repository's existing source
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare private Android release signing key
        if: env.NATIVOS_SIGNING_ENABLED == 'true'
        working-directory: android
        env:
          NATIVOS_KEYSTORE_BASE64: ${{ secrets.NATIVOS_KEYSTORE_BASE64 }}
          NATIVOS_KEYSTORE_PASSWORD: ${{ secrets.NATIVOS_KEYSTORE_PASSWORD }}
          NATIVOS_KEY_ALIAS: ${{ secrets.NATIVOS_KEY_ALIAS }}
          NATIVOS_KEY_PASSWORD: ${{ secrets.NATIVOS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$NATIVOS_KEYSTORE_BASE64" | base64 --decode > signing/nativos-release.jks
          chmod 600 signing/nativos-release.jks
          cat > signing/keystore.properties <<EOF
          storeFile=signing/nativos-release.jks
          storePassword=$NATIVOS_KEYSTORE_PASSWORD
          keyAlias=$NATIVOS_KEY_ALIAS
          keyPassword=$NATIVOS_KEY_PASSWORD
          EOF
          chmod 600 signing/keystore.properties

      - name: Build signed release APK for future in-place updates
        if: env.NATIVOS_SIGNING_ENABLED == 'true'
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK and exact rootfs used by the build
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: nativos-debug-and-rootfs-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz
            android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed release APK
        if: success() && env.NATIVOS_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: nativos-signed-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
