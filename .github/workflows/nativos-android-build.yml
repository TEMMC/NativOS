name: NativOS Android build (source unchanged)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nativos-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativos-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build existing NativOS app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository without modifying source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect required existing build inputs
        shell: bash
        run: |
          set -euxo pipefail
          echo "Commit: $GITHUB_SHA"
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/xlorie-upstream/arm64-v8a/libXlorie.so
          ls -lah android/app/src/main/assets/rootfs/
          if [[ ! -f android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz ]]; then
            echo "::warning::The required rootfs archive is not tracked at the expected path. Gradle's verifyBundledRootfs task is expected to fail."
          fi

      - name: Build debug APK using the repository's existing source
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK if build produced one
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nativos-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
