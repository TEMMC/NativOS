name: MT-GNOME Android launcher

on:
  push:
    branches: [ main, fix/mt-gnome-pty-isolation, feature/mt-gnome-x11-wayland ]
    paths:
      - ".gitmodules"
      - "vendor/magicdesk"
      - ".github/workflows/mt-gnome-build.yml"
      - "android/settings.gradle.kts"
      - "android/build.gradle.kts"
      - "android/gradle/**"
      - "android/gnome/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt-gnome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SIGNING_ENABLED: ${{ secrets.MTOS_KEYSTORE_BASE64 != '' && secrets.MTOS_KEYSTORE_PASSWORD != '' && secrets.MTOS_KEY_ALIAS != '' && secrets.MTOS_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android and native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bison flex ninja-build python3 python3-venv python3-pip patch pkg-config cmake libexpat1-dev libffi-dev libxml2-dev
          sdkmanager --licenses </dev/null
          sdkmanager "platform-tools" "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Meson for the Wayland compositor build
        working-directory: android
        run: |
          set -euo pipefail
          python3 -m venv build/wayland-tools
          build/wayland-tools/bin/pip install --disable-pip-version-check meson==1.9.1
          build/wayland-tools/bin/meson --version
      - name: Verify pinned MagicDesk X11 and Wayland sources
        run: |
          set -euo pipefail
          test -f vendor/magicdesk/x11-runtime/build.gradle
          test -f vendor/magicdesk/hosted-runtime/build.gradle
          test -f vendor/magicdesk/wayland-runtime/build.gradle
          test -f vendor/magicdesk/docs/wayland.md
          test -f vendor/magicdesk/vendor/magicdesk-x11/lorie/src/main/cpp/CMakeLists.txt
          grep -q "GNU GENERAL PUBLIC LICENSE" vendor/magicdesk/vendor/magicdesk-x11/LICENSE
          grep -q "wayland-runtime" android/settings.gradle.kts
          grep -q 'implementation(project(":wayland-runtime"))' android/gnome/build.gradle.kts
      - name: Download five real nature wallpapers
        run: |
          set -euo pipefail
          DIR=android/gnome/src/main/assets/wallpapers
          mkdir -p "$DIR"
          curl -fL --retry 3 --connect-timeout 20 -o "$DIR/mountain_lake.jpg" "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&q=82&fit=crop"
          curl -fL --retry 3 --connect-timeout 20 -o "$DIR/forest.jpg" "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=82&fit=crop"
          curl -fL --retry 3 --connect-timeout 20 -o "$DIR/mountain_peaks.jpg" "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600&q=82&fit=crop"
          curl -fL --retry 3 --connect-timeout 20 -o "$DIR/tropical_beach.jpg" "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=82&fit=crop"
          curl -fL --retry 3 --connect-timeout 20 -o "$DIR/open_landscape.jpg" "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&q=82&fit=crop"
          for image in "$DIR"/*.jpg; do
            test -s "$image"
            test "$(stat -c%s "$image")" -gt 20000
            file "$image"
          done
      - name: Prepare existing NativOS release signing key
        if: env.SIGNING_ENABLED == 'true'
        working-directory: android
        env:
          MTOS_KEYSTORE_BASE64: ${{ secrets.MTOS_KEYSTORE_BASE64 }}
          MTOS_KEYSTORE_PASSWORD: ${{ secrets.MTOS_KEYSTORE_PASSWORD }}
          MTOS_KEY_ALIAS: ${{ secrets.MTOS_KEY_ALIAS }}
          MTOS_KEY_PASSWORD: ${{ secrets.MTOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$MTOS_KEYSTORE_BASE64" | base64 --decode > signing/mt-os-release.jks
          chmod 600 signing/mt-os-release.jks
          cat > signing/keystore.properties <<EOF
          storeFile=signing/mt-os-release.jks
          storePassword=$MTOS_KEYSTORE_PASSWORD
          keyAlias=$MTOS_KEY_ALIAS
          keyPassword=$MTOS_KEY_PASSWORD
          EOF
          chmod 600 signing/keystore.properties
      - name: Enforce MT-GNOME platform boundaries and dual graphics wiring
        run: |
          set -euo pipefail
          if grep -nEi '(^|[[:space:]])(implementation|api|runtimeOnly|compileOnly|testImplementation)[(].*(phosh|phoc)|MT-Phosh|MT-Phoc' android/gnome/build.gradle.kts; then
            echo "MT-GNOME must not declare MT-Phosh or MT-Phoc dependencies."
            exit 1
          fi
          test -d vendor/magicdesk/x11-runtime
          test -d vendor/magicdesk/hosted-runtime
          test -d vendor/magicdesk/wayland-runtime
          test -d vendor/magicdesk/wayland-runtime/src/main/java
          grep -q 'implementation(project(":x11-runtime"))' android/gnome/build.gradle.kts
          grep -q 'implementation(project(":wayland-runtime"))' android/gnome/build.gradle.kts
          echo "Both embedded graphics runtimes and shared hosted renderer are wired into MT-GNOME."
      - name: Guard isolated Linux application launch namespace
        run: |
          set -euo pipefail
          LAUNCHER=android/gnome/src/main/java/com/mt/gnome/LinuxDistroLauncher.kt
          if grep -Fq 'mount --bind /dev ' "$LAUNCHER"; then exit 1; fi
          if grep -Fq 'ln -sf /dev/pts/ptmx' "$LAUNCHER"; then exit 1; fi
          grep -Fq 'unshare -m' "$LAUNCHER"
          grep -Fq 'mount --make-rprivate /' "$LAUNCHER"
          grep -Fq 'newinstance,ptmxmode=0666' "$LAUNCHER"
          echo "Private Linux application mount namespace guard passed."
          test ! -f android/gnome/src/main/java/com/mt/gnome/TerminalActivity.kt
          test ! -f android/gnome/src/main/java/com/mt/gnome/FloatingTerminalService.kt
          test ! -f android/gnome/src/main/java/com/mt/gnome/MtTerminalBridge.kt
          ! grep -q 'terminal-view' android/gnome/build.gradle.kts
          grep -q 'DistroCatalogActivity' android/gnome/src/main/AndroidManifest.xml
          grep -q 'Install GNOME Terminal' android/gnome/src/main/java/com/mt/gnome/DistroCatalogActivity.kt
          grep -q 'gnome-terminal' android/gnome/src/main/java/com/mt/gnome/LinuxDistroLauncher.kt
          echo "Embedded terminal removal and real GNOME Terminal launcher checks passed."
      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build X11 and Wayland runtime tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace \
            :x11-runtime:testDebugUnitTest \
            :wayland-runtime:testDebugUnitTest \
            :wayland-runtime:lintDebug
      - name: Build MT-GNOME debug APK with both graphics runtimes
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :gnome:assembleDebug
      - name: Build release APK with the same NativOS signing certificate
        if: env.SIGNING_ENABLED == 'true'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :gnome:assembleRelease
      - name: Verify release signature
        if: env.SIGNING_ENABLED == 'true'
        working-directory: android
        run: |
          APK=gnome/build/outputs/apk/release/gnome-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MT-GNOME-dual-graphics-debug
          path: android/gnome/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MT-GNOME-dual-graphics-signed-release
          path: android/gnome/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
